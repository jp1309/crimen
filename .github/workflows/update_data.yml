name: Actualizar datos y dashboard

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update_data.yml"
      - "data/raw/mdi_homicidios_intencionales_pm_actual.xlsx"
      - "data/raw/mdi_homicidios_intencionales_pm_historico.xlsx"
      - "data/source_manifest.json"
      - "data/processed/homicidios_consolidado.csv"
      - "homicidios_clean.csv"

permissions:
  contents: read

concurrency:
  group: verify-homicidios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Verificar pipeline y datos versionados
        run: |
          python -m scripts.consolidar_y_limpiar
          python -m scripts.verificar_datos
          python -m scripts.verificar_coordenadas
          python -m unittest discover -v
