name: Actualizar Dashboard

on:
  push:
    paths:
      - 'data/raw/**.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl unidecode numpy

      - name: Ejecutar pipeline ETL
        run: |
          cd $GITHUB_WORKSPACE
          python -m scripts.consolidar_y_limpiar

      - name: Subir cambios
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add homicidios_clean.csv data/processed/homicidios_consolidado.csv
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Auto-update: Datos actualizados [GitHub Action]"
            git push
          fi
