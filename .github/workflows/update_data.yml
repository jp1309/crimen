name: Actualizar datos y dashboard

on:
  schedule:
    # El Ministerio suele publicar a mitad de mes. Los intentos posteriores
    # cubren retrasos sin depender de una computadora o tarea local.
    - cron: "17 9 2,5,8,11,15,18,21,24,27,30 * *"
      timezone: "America/New_York"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update_data.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-homicidios
  cancel-in-progress: false

jobs:
  verify-pipeline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Verificar pipeline y datos versionados
        run: |
          python -m scripts.consolidar_y_limpiar
          python -m scripts.verificar_datos
          python -m scripts.verificar_coordenadas
          python -m unittest discover -v

  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Comprobar acceso directo a la fuente oficial
        id: route
        shell: bash
        env:
          SOURCE_URL: https://www.datosabiertos.gob.ec/dataset/0ec65ab4-e6ab-40ab-aab9-c91e912f9faf/resource/cb8f704e-2b27-4d7f-9431-d40c4e27fa48/download
        run: |
          set -euo pipefail
          if curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 45 \
            --range 0-1023 \
            --output /dev/null \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) Chrome/131.0.0.0 Safari/537.36" \
            "$SOURCE_URL"; then
            echo "use_warp=false" >> "$GITHUB_OUTPUT"
            echo "La fuente oficial acepta la salida directa del runner."
          else
            echo "use_warp=true" >> "$GITHUB_OUTPUT"
            echo "La fuente bloquea la salida directa; se activara WARP."
          fi

      - name: Activar ruta remota alternativa con Cloudflare WARP
        if: steps.route.outputs.use_warp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor \
                --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp+doh
          sudo warp-cli --accept-tos connect

          connected=false
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 10 \
              https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on$'; then
              connected=true
              break
            fi
            sleep 2
          done
          if [[ "$connected" != "true" ]]; then
            sudo warp-cli --accept-tos status || true
            echo "WARP no establecio una ruta remota util." >&2
            exit 1
          fi

      - name: Sincronizar fuentes oficiales
        id: sync
        run: python -m scripts.descargar_datos --github-output "$GITHUB_OUTPUT"

      - name: Reconstruir y verificar datos acumulativos
        if: steps.sync.outputs.changed == 'true'
        run: |
          python -m scripts.consolidar_y_limpiar
          python -m scripts.verificar_datos
          python -m scripts.verificar_coordenadas
          python -m unittest discover -v

      - name: Guardar actualizacion
        id: commit
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/raw/mdi_homicidios_intencionales_pm_actual.xlsx \
            data/raw/mdi_homicidios_intencionales_pm_historico.xlsx \
            data/source_manifest.json \
            data/processed/homicidios_consolidado.csv \
            homicidios_clean.csv

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "La fuente cambio sin producir diferencias versionables."
            exit 0
          fi

          git commit -m "Datos: actualizar homicidios desde fuente oficial"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Solicitar publicacion de GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Verificar CSV publicado
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          PUBLIC_CSV: https://jp1309.github.io/crimen/homicidios_clean.csv
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          expected=$(sha256sum homicidios_clean.csv | cut -d' ' -f1)
          for attempt in {1..30}; do
            if curl --fail --location --silent --show-error \
              --max-time 60 \
              --output /tmp/homicidios_public.csv \
              "${PUBLIC_CSV}?commit=${COMMIT_SHA}"; then
              actual=$(sha256sum /tmp/homicidios_public.csv | cut -d' ' -f1)
              if [[ "$actual" == "$expected" ]]; then
                echo "GitHub Pages sirve el CSV actualizado."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "GitHub Pages no sirvio el CSV esperado dentro del plazo." >&2
          exit 1
