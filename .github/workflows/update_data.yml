name: Actualizar datos y dashboard

on:
  push:
    paths:
      - 'data/raw/**/*.xlsx'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update_data.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: update-homicidios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Reconstruir datos acumulativos
        id: rebuild
        run: |
          python -m scripts.consolidar_y_limpiar
          python -m scripts.verificar_datos
          python -m scripts.verificar_coordenadas

      - name: Guardar actualizacion
        id: commit
        if: steps.rebuild.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/raw \
            data/source_manifest.json \
            data/processed/homicidios_consolidado.csv \
            homicidios_clean.csv

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios para guardar"
          else
            git commit -m "Datos reconstruidos desde fuentes oficiales"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # El sitio usa actualmente GitHub Pages legacy desde main. Los commits
      # creados con GITHUB_TOKEN no disparan otro workflow ni un build de Pages,
      # por lo que se solicita el build explicitamente.
      - name: Publicar GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
