name: Diagnosticar acceso remoto a fuente oficial

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Probar recurso oficial
        shell: bash
        env:
          SOURCE_URL: https://www.datosabiertos.gob.ec/dataset/0ec65ab4-e6ab-40ab-aab9-c91e912f9faf/resource/cb8f704e-2b27-4d7f-9431-d40c4e27fa48/download
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --range 0-1023 \
            --output source-sample.bin \
            --user-agent "Mozilla/5.0 Chrome/131.0.0.0 Safari/537.36" \
            "$SOURCE_URL"
          test -s source-sample.bin
